<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Classroom Spotlight & Mingle</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;

        /* BACKGROUND IMAGE SETTINGS */
        background-image:
          linear-gradient(rgba(244, 244, 244, 0.75), rgba(244, 244, 244, 0.75)),
          url("assets/background.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* CONTROLS */
      .controls {
        margin-bottom: 30px;
        display: flex;
        gap: 15px;
        background: rgba(255, 255, 255, 0.95);
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        z-index: 2000;
        position: relative;
      }

      .controls button {
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        background: #3498db;
        color: white;
        cursor: pointer;
        font-weight: bold;
      }

      .btn-pair {
        background: #e67e22 !important;
      }

      /* CLASSROOM GRID */
      #classroom-wrapper {
        width: 100%;
        max-width: 1200px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .row-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
        width: 100%;
      }
      
      /* Row Number Label sa Kaliwa */
      .row-label {
        font-weight: bold;
        font-size: 16px;
        color: #333;
        background: rgba(255, 255, 255, 0.9);
        padding: 8px 12px;
        border-radius: 6px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        min-width: 60px;
        text-align: center;
      }

      .desk-row {
        display: flex;
        flex-wrap: nowrap;
        gap: 12px;
        background: rgba(255, 255, 255, 0.92);
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(5px);
      }
      .slot {
        width: 60px;
        height: 60px;
        border: 2px dashed #ccc;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        flex-shrink: 0;
      }
      .desk {
        width: 60px;
        height: 60px;
        background: #eee;
        border: 2px solid #000;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        user-select: none;
        box-sizing: border-box;
        transition: 0.2s;
      }

      /* Person Icon Styling */
      .desk svg {
        width: 32px;
        height: 32px;
        fill: #333;
        transition: 0.2s;
      }

      /* SPOTLIGHT & ZOOM ANIMATION EFFECTS */
      .active {
        background: #4da6ff !important;
        transform: scale(1.1);
      }
      .active svg {
        fill: white !important;
      }

      /* Selected Desk Zoom In & Out Animation */
      .selected {
        background: gold !important;
        border-color: orange !important;
        z-index: 10;
        position: relative;
        animation: zoomInOut 0.6s ease-in-out infinite alternate;
        cursor: pointer !important;
      }
      .selected svg {
        fill: #fff !important;
      }

      /* DISABLED / DONE DESK */
      .desk.disabled {
        background: #d6d6d6 !important;
        border-color: #aaa !important;
        cursor: not-allowed !important;
        pointer-events: none !important;
        animation: none !important;
        transform: none !important;
      }
      .desk.disabled svg {
        fill: #888 !important;
      }

      @keyframes zoomInOut {
        0% {
          transform: scale(1);
          box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        100% {
          transform: scale(1.4);
          box-shadow:
            0 0 25px gold,
            0 0 10px orange;
        }
      }

      .delete-btn {
        background-color: #ff4d4d;
        color: white;
        border: none;
        width: 45px;
        height: 45px;
        cursor: pointer;
        border-radius: 6px;
        font-size: 24px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label
        >ROW: <input type="number" id="slotCount" value="8" style="width: 40px"
      /></label>
      <label
        >SPACES:
        <input type="number" id="fillCount" value="8" style="width: 40px"
      /></label>
      <button onclick="addRow()">Add Row</button>
      <button onclick="startRoulette(1)">🎲 Pick Student</button>
      <button class="btn-pair" onclick="startRoulette(2)">
        👥 Pick a Pair
      </button>
    </div>

    <div id="classroom-wrapper"></div>

    <script>
      let nextNumber = 1;
      let rouletteRunning = false;

      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      function playSound(freq = 600, type = "sine", duration = 0.05) {
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioCtx.currentTime + duration,
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }

      // Function para i-update ang mga nakalistang row labels sa kaliwa
      function updateRowLabels() {
        const containers = document.querySelectorAll("#classroom-wrapper .row-container");
        const totalRows = containers.length;
        containers.forEach((container, index) => {
          const label = container.querySelector(".row-label");
          if (label) {
            // Babaligtarin natin ang bilang dahil prepend ang ginagamit sa pagdagdag (Bottom-up o Top-down ayon sa gusto mo)
            label.innerText = `Row ${totalRows - index}`;
          }
        });
      }

      function addRow() {
        const slots = parseInt(document.getElementById("slotCount").value);
        const fill = parseInt(document.getElementById("fillCount").value);
        const wrapper = document.getElementById("classroom-wrapper");
        
        const container = document.createElement("div");
        container.className = "row-container";

        // Gumawa ng Row Label sa kaliwa
        const rowLabel = document.createElement("div");
        rowLabel.className = "row-label";
        container.appendChild(rowLabel);

        const newRow = document.createElement("div");
        newRow.className = "desk-row";
        for (let i = 0; i < slots; i++) {
          const slot = document.createElement("div");
          slot.className = "slot";
          if (i % 2 === 1 && i !== slots - 1) slot.style.marginRight = "30px";
          if (i < fill) slot.appendChild(createDesk(nextNumber++));
          slot.addEventListener("dragover", (e) => e.preventDefault());
          slot.addEventListener("drop", handleDrop);
          newRow.appendChild(slot);
        }

        const del = document.createElement("button");
        del.innerHTML = "&times;";
        del.className = "delete-btn";
        del.onclick = () => {
          container.remove();
          updateRowLabels();
        };

        container.append(newRow, del);
        wrapper.prepend(container);
        
        // I-update ang mga label tuwing may idinadagdag
        updateRowLabels();
      }

      function createDesk(num) {
        const d = document.createElement("div");
        d.className = "desk";
        
        // Nilagyan natin ng Person SVG Icon sa loob ng bawat desk
        d.innerHTML = `<svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>`;
        
        d.draggable = true;
        d.addEventListener("dragstart", (e) =>
          e.target.classList.add("dragging"),
        );
        d.addEventListener("dragend", (e) =>
          e.target.classList.remove("dragging"),
        );

        // Kapag pinindot ang napiling desk, diretsong madi-disable ito
        d.onclick = () => {
          if (
            d.classList.contains("selected") &&
            !d.classList.contains("disabled")
          ) {
            d.classList.remove("selected");
            d.classList.add("disabled");
            playSound(500, "square", 0.1);
          }
        };
        return d;
      }

      function handleDrop(e) {
        e.preventDefault();
        const drag = document.querySelector(".dragging");
        if (!drag) return;
        if (e.currentTarget.children.length === 0)
          e.currentTarget.appendChild(drag);
        else {
          const old = e.currentTarget.firstChild;
          drag.parentElement.appendChild(old);
          e.currentTarget.appendChild(drag);
        }
      }

      async function startRoulette(count) {
        if (rouletteRunning) return;
        document
          .querySelectorAll(".desk")
          .forEach((d) => d.classList.remove("selected", "active"));

        const desks = Array.from(
          document.querySelectorAll(".desk:not(.disabled)"),
        );
        if (desks.length < count) {
          alert("Lahat ng available na estudyante ay napili na!");
          return;
        }
        rouletteRunning = true;

        for (let i = 0; i < 20; i++) {
          desks.forEach((d) => d.classList.remove("active"));
          let temp = [];
          while (temp.length < count) {
            let r = Math.floor(Math.random() * desks.length);
            if (!temp.includes(r)) temp.push(r);
          }
          temp.forEach((idx) => desks[idx].classList.add("active"));

          playSound(400 + i * 20, "triangle", 0.04);

          await new Promise((r) => setTimeout(r, 40 + i * 5));
        }
        desks.forEach((d) => d.classList.remove("active"));
        let final = [];
        while (final.length < count) {
          let r = Math.floor(Math.random() * desks.length);
          if (!final.includes(r)) final.push(r);
        }
        final.forEach((idx) => desks[idx].classList.add("selected"));

        playSound(880, "sine", 0.2);
        setTimeout(() => playSound(1174.66, "sine", 0.3), 150);

        rouletteRunning = false;
      }
    </script>
  </body>
</html>
